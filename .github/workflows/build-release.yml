name: Build and Release LANimals

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: LANimals-windows-x64.zip
            asset_path: dist/LANimals-windows-x64.zip
          - os: macos-latest
            artifact_name: LANimals-macos.zip
            asset_path: dist/LANimals-macos.zip
          - os: ubuntu-latest
            artifact_name: LANimals-linux-x64.tar.gz
            asset_path: dist/LANimals-linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q

      - name: Build Application
        run: |
          python scripts/build_app.py --mode onedir

      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/LANimals -DestinationPath dist/LANimals-windows-x64.zip

      - name: Package macOS Artifact
        if: runner.os == 'macOS'
        run: |
          cd dist && zip -r LANimals-macos.zip LANimals.app

      - name: Package Linux Artifact
        if: runner.os == 'Linux'
        run: |
          cd dist && tar -czvf LANimals-linux-x64.tar.gz LANimals

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
