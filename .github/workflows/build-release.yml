name: Build and Release LANimals

on:
  push:
    tags:
      - 'v*'
  # 网页发布：Actions → Build and Release LANimals → Run workflow，分支选 main 并填写版本号。
  # 版本号留空则只打包、不发布。
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 v0.3.0，须与 pyproject.toml 一致）；留空只打包不发布'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  # Windows 托管运行器可能使用旧版标准输出代码页；统一 UTF-8，确保构建日志和子进程稳定。
  PYTHONUTF8: '1'

jobs:
  validate:
    name: Validate release version
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check version format, pyproject.toml, branch, and existing tags
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/check_release_version.py "$VERSION" --ref "$GITHUB_REF"

  build:
    name: Build on ${{ matrix.os }}
    needs: validate
    # validate 被跳过（推送标签或只打包）时仍继续；校验失败或手动取消时停止。
    if: ${{ !cancelled() && needs.validate.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: LANimals-windows-x64.zip
            asset_path: dist/LANimals-windows-x64.zip
          - os: macos-latest
            artifact_name: LANimals-macos.zip
            asset_path: dist/LANimals-macos.zip
          - os: ubuntu-latest
            artifact_name: LANimals-linux-x64.tar.gz
            asset_path: dist/LANimals-linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q

      - name: Build Application
        run: |
          python scripts/build_app.py --mode onedir

      - name: Launch packaged app and check the local service
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/smoke_frozen.py --reset-data

      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/LANimals -DestinationPath dist/LANimals-windows-x64.zip

      - name: Package macOS Artifact
        if: runner.os == 'macOS'
        run: |
          cd dist && zip -r LANimals-macos.zip LANimals.app

      - name: Package Linux Artifact
        if: runner.os == 'Linux'
        run: |
          cd dist && tar -czvf LANimals-linux-x64.tar.gz LANimals

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  release:
    name: Create GitHub Release
    needs: [validate, build]
    # 推送 v* 标签，或网页填写了版本号且校验通过；任一平台打包失败都不会发布。
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.version != '' && needs.validate.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # 网页发布时由 Release 在本次构建的提交上创建标签；推送标签时沿用该标签。
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
