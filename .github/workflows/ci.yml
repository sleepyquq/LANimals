name: CI

# 每次推送都在 Windows / macOS / Linux 上跑测试、生成控制面板截图，
# 并实际启动一次 PyInstaller 打包版，弥补手头没有全部平台真机的问题。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux Qt runtime and CJK fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Check frontend syntax
        if: runner.os == 'Linux'
        run: node --check lanimals/web/app.js

      - name: Render control panel previews
        if: always()
        run: |
          python scripts/gui_preview.py --out previews --lang zh-CN
          python scripts/gui_preview.py --out previews --lang en
          python scripts/gui_preview.py --out previews --lang zh-CN --dark

      - name: Upload control panel previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-preview-${{ runner.os }}
          path: previews/
          if-no-files-found: warn

      - name: Build packaged app (onedir)
        run: python scripts/build_app.py --mode onedir

      - name: Launch packaged app and check the local service
        run: python scripts/smoke_frozen.py --reset-data
