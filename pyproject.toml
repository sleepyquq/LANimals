[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanimals"
version = "0.2.1"
description = "A lightweight local-network group chat with animal device identities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "psutil>=6.0,<8.0",
  "segno>=1.6,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
  "zeroconf>=0.140,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "PySide6-Essentials>=6.8,<7",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "pyinstaller>=6.0.0",
]

[project.scripts]
lanimals = "lanimals.__main__:main"

[tool.setuptools.package-data]
lanimals = [
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web/locales/*.json",
  "gui/assets/*",
]

[tool.setuptools.packages.find]
include = ["lanimals*"]
exclude = ["data*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".venv", "build", "dist", "data", ".git", ".hermes", "*.egg-info"]
